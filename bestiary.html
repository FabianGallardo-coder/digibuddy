<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/bestiary.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bestiario · digibuddy</title>
    <script type="module" src="/src/bestiary.ts" defer></script>
  </head>

  <body class="bestiary">
    <header id="bx-head">
      <h1>Bestiario</h1>
      <span id="bx-count">cargando…</span>
      <button id="bx-close" type="button" title="Cerrar">✕</button>
    </header>

    <div id="bx-filters">
      <input id="bx-q" type="search" placeholder="Buscar por nombre…" autocomplete="off" />
      <div id="bx-stages" class="bx-chips"></div>
      <div id="bx-attrs" class="bx-chips"></div>
    </div>

    <main id="bx-list"></main>

    <footer id="bx-foot">
      <button id="bx-more" type="button">Mostrar más</button>
    </footer>

    <aside id="bx-detail" class="bx-hidden">
      <button id="bx-back" type="button">← Volver</button>
      <canvas id="bx-sprite" width="16" height="16"></canvas>
      <div id="bx-meta"></div>
    </aside>
  </body>
</html>
