name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: ubuntu-22.04
            args: ''
          - os: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'macOS'
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'macOS'
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          tagName: v__VERSION__
          releaseName: digibuddy v__VERSION__
          releaseBody: |
            digibuddy 0.1.0 — desktop Digimon pet for [tuipet](https://github.com/joeltco/tuipet).

            **Install**
            - Windows: `digibuddy_*_setup.exe` (NSIS) or `.msi`. SmartScreen will warn (unsigned) → *More info → Run anyway*.
            - Linux: `.deb` or `.AppImage` (`chmod +x` first).
            - macOS: `.dmg` (ad-hoc signed) → right-click → Open the first time.

            **Chat** needs [Ollama](https://ollama.com) (`ollama pull dolphin-phi`); without it, digibuddy answers with built-in rules.

            Fan project, © Bandai — see `NOTICE`. Read-only: never writes your save.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
